name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One run at a time. Two quick pushes to main would otherwise run release-please and
# ship-release-tracking concurrently against the same release PR branch. Queued, not
# cancelled: a cancelled run could drop a release or its publish.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # The manifest has one root component; every package ships at its version. It used to
    # have two, the root and src/ZeroAlloc.Flux.Blazor. In multi-component mode the action
    # does not populate the singular release_created / version / tag_name outputs, so
    # gating the publish job on them meant it never ran: v1.1.0 and v1.1.1 were both tagged
    # and changelogged without ever reaching NuGet. The job gates on releases_created,
    # which is set in either mode.
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      version: ${{ steps.release.outputs.version }}
      # Read by ship-release-tracking. A step output is only visible to another job
      # when the job re-exports it here; without these the job's `if:` is always false.
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          # Manifest mode: read release-please-config.json + .release-please-manifest.json
          # from the repo root. Single-package mode (release-type passed inline) ignores
          # those files and tracks state via PR labels — which can corrupt and produce
          # wrong-version PRs (e.g. 2.0.1 against feat! commits). Manifest mode is the
          # safer default.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # Marks the analyzer rules and public API that the pending release adds as shipped,
  # by committing the move onto the release PR branch. Merging that PR then lands the
  # move in the same commit that tags the release, so AnalyzerReleases.Shipped.md and
  # PublicAPI.Shipped.txt always say what each published version contains. Without it
  # nothing was ever marked shipped, so the analyzers could not flag a change to a
  # shipped rule or a shipped API. Shared from ZeroAlloc-Net/.github; see
  # ZeroAlloc-Net/.github#38. release-please rebuilds its branch from main whenever
  # main moves, dropping this commit; the job then runs again in the same workflow run
  # and re-applies it. It commits nothing when nothing is unshipped.
  ship-release-tracking:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    uses: ZeroAlloc-Net/.github/.github/workflows/ship-release-tracking.yml@main
    with:
      branch: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    secrets:
      # Same token as release-please, so this push triggers the PR's checks exactly
      # as release-please's own push does. Empty falls back to GITHUB_TOKEN.
      RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release -p:Version=${{ needs.release-please.outputs.version }}

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack all packages at the release version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "::error::release-please reported a release but produced no version"
            exit 1
          fi
          mkdir -p ./nupkg

          # Every package ships at the same version, so the assembly stamped by the build
          # step above is already correct and pack only has to label the package. Projects
          # opt out with IsPackable false -- ZeroAlloc.Flux.Generator does, because it is
          # bundled into ZeroAlloc.Flux as analyzers/dotnet/cs rather than published.
          for csproj in src/*/*.csproj; do
            if grep -q "<IsPackable>false</IsPackable>" "$csproj"; then
              echo "Skipping $csproj (not packable)"
              continue
            fi
            echo "Packing $csproj at $VERSION"
            dotnet pack "$csproj" -c Release --no-build -p:PackageVersion="$VERSION" -o ./nupkg
          done

          ls -la ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          # One component, and release-please-config.json leaves the component out of the
          # tag, so the tag is simply v<version>.
          echo "Uploading packages to v$VERSION"
          gh release upload "v$VERSION" ./nupkg/*.nupkg --clobber
