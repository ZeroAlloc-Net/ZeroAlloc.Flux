name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # This manifest has two components — the root (ZeroAlloc.Flux + its bundled generator)
    # and src/ZeroAlloc.Flux.Blazor, versioned independently. In multi-component mode the
    # action does not populate the singular release_created / version / tag_name outputs;
    # those exist only for a single-package manifest. Gating the publish job on them meant
    # it never ran, so v1.1.0 and v1.1.1 were both tagged and changelogged without ever
    # reaching NuGet. Use releases_created plus the singular version output.
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          # Manifest mode: read release-please-config.json + .release-please-manifest.json
          # from the repo root. Single-package mode (release-type passed inline) ignores
          # those files and tracks state via PR labels — which can corrupt and produce
          # wrong-version PRs (e.g. 2.0.1 against feat! commits). Manifest mode is the
          # safer default.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release -p:Version=${{ needs.release-please.outputs.version }}

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack all packages at the release version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "::error::release-please reported a release but produced no version"
            exit 1
          fi
          mkdir -p ./nupkg

          # Every package ships at the same version, so the assembly stamped by the build
          # step above is already correct and pack only has to label the package. Projects
          # opt out with IsPackable false -- ZeroAlloc.Flux.Generator does, because it is
          # bundled into ZeroAlloc.Flux as analyzers/dotnet/cs rather than published.
          for csproj in src/*/*.csproj; do
            if grep -q "<IsPackable>false</IsPackable>" "$csproj"; then
              echo "Skipping $csproj (not packable)"
              continue
            fi
            echo "Packing $csproj at $VERSION"
            dotnet pack "$csproj" -c Release --no-build -p:PackageVersion="$VERSION" -o ./nupkg
          done

          ls -la ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          # One component, and release-please-config.json leaves the component out of the
          # tag, so the tag is simply v<version>.
          echo "Uploading packages to v$VERSION"
          gh release upload "v$VERSION" ./nupkg/*.nupkg --clobber
