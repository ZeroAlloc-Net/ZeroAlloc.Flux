name: history-scan

# Full-history secret scan of every ref. Run it by hand, for example before a release or after a suspected leak.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  history-scan:
    uses: MarcelRoozekrans/ci-baseline/.github/workflows/history-scan.yml@v1
    secrets:
      GITLEAKS_CONFIG: ${{ secrets.GITLEAKS_CONFIG }}
